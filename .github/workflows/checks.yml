name: Cross-language checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - uses: VirtusLab/scala-cli-setup@v1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: server/go.sum
      - name: Worker tests and real cross-language integration
        run: python3 scripts/verify.py --build
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pocketledger-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
