name: PocketLedger
options:
  bundleIdPrefix: com.bhaveshmantrabuddi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
packages:
  PocketLedgerKit:
    path: PocketLedgerKit
targets:
  PocketLedger:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PocketLedgerKit
        product: LedgerCore
      - package: PocketLedgerKit
        product: ReceiptKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: PocketLedger
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Choose a receipt photo to recognize its text on this device.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  PocketLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PocketLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketLedger:
    build:
      targets:
        PocketLedger: all
    test:
      targets: [PocketLedgerUITests]
      gatherCoverageData: true
